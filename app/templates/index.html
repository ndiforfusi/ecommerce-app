<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Tech eCommerce Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Welcome to the Future of IT Products</h1>
    </header>
    <section class="products">
        {% for product in products %}
        <div class="product-card">
            <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}">
            <h2>{{ product.name }}</h2>
            <p class="price">{{ product.price }}</p>
            <a href="/product/{{ product.id }}" class="button">View Details</a>
        </div>
        {% endfor %}
    </section>
    <footer>
        <a href="/products">Browse All Products</a> | <a href="/checkout">Go to Checkout</a>
    </footer>
</body>
</html>
