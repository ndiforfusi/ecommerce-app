<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - High-Tech eCommerce</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="checkout-container">
        <h1>Secure Checkout</h1>
        <form id="checkout-form">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Shipping Address</label>
            <input type="text" id="address" name="address" required>

            <label for="card">Credit Card Number</label>
            <input type="text" id="card" name="card" required placeholder="XXXX-XXXX-XXXX-XXXX">

            <button type="submit" class="button">Complete Purchase</button>
        </form>
        <a href="/products" class="button secondary">Continue Shopping</a>
    </div>
</body>
</html>
