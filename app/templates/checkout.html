<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - High-Tech eCommerce</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="checkout-container">
        <h1>Secure Checkout</h1>
        
        <!-- Order Summary -->
        <div class="order-summary">
            <h2>Order Summary</h2>
            <ul>
                <li>Product Name: <span id="product-name">Selected Item</span></li>
                <li>Price: <span id="product-price">$0.00</span></li>
                <li>Shipping: <span>$10.00</span></li>
                <li><strong>Total: <span id="total-price">$0.00</span></strong></li>
            </ul>
        </div>

        <!-- Payment & Shipping Form -->
        <form id="checkout-form">
            <h2>Billing Details</h2>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Shipping Address</label>
            <input type="text" id="address" name="address" required>

            <label for="card">Credit Card Number</label>
            <input type="text" id="card" name="card" required placeholder="XXXX-XXXX-XXXX-XXXX">

            <label for="exp-date">Expiration Date</label>
            <input type="month" id="exp-date" name="exp-date" required>

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" required maxlength="3">

            <button type="submit" class="button">Complete Purchase</button>
        </form>

        <a href="/products" class="button secondary">Continue Shopping</a>
    </div>
</body>
</html>
